name = "hq-relay"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
# The only origin allowed by CORS: the site, e.g. https://your-org.github.io (no trailing slash).
ORIGIN = "https://YOUR-ORG.github.io"

[[d1_databases]]
binding = "DB"
database_name = "hq-relay"
# Paste the id printed by: npx wrangler d1 create hq-relay
database_id = "00000000-0000-0000-0000-000000000000"
